name: CI

# Runs on every push to main/dev, and on every pull request targeting them.
# The pull_request trigger is the important one: it lets us require these
# checks to pass before a branch can be merged.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# If you push twice quickly, cancel the older run instead of queueing both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - checks and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project/backend

    # Deliberately mirrors the production configuration, with two
    # differences: no DATABASE_URL (so settings.py falls back to SQLite and
    # CI needs no Supabase access), and no API keys (the tests never call a
    # paid service). None of these values are secret.
    env:
      DJANGO_SECRET_KEY: ci-only-key-not-used-in-production
      DJANGO_DEBUG: "false"
      DJANGO_SECURE_SSL_REDIRECT: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      MEDIA_ROOT: /tmp/ci-media

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: project/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system checks
        run: python manage.py check

      - name: Detect models changed without a migration
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test --verbosity 2

  docker:
    name: Backend - Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/harris-05/ai-study-assistant-backend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Only authenticate when we intend to publish. Pull requests build
      # the image to prove it still compiles, but must never push -- a PR
      # from a fork would otherwise be able to publish an image the server
      # then deploys.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Building here rather than on the EC2 instance is deliberate. The
      # t3.micro has 1 GB of RAM and burstable CPU: a full dependency
      # rebuild exhausts its CPU credits and makes the whole machine
      # unresponsive, taking the live site down with it. GitHub's runners
      # have 4 cores and 16 GB, so the same build takes a couple of
      # minutes and costs production nothing.
      - name: Build image (push only on main)
        uses: docker/build-push-action@v6
        with:
          context: project/backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # Layer cache shared between runs, so unchanged dependencies are
          # not reinstalled every time.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend:
    name: Frontend - build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: project/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Catches broken imports, syntax errors and missing files before
      # Vercel tries to build the same thing.
      - name: Build
        run: npm run build
