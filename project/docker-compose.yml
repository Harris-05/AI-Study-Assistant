# Deployment layout for a single Oracle Cloud (OCI) compute instance
# (e.g. the Always Free Ampere A1 shape):
#
#   Internet -> nginx (TLS, :443) -> frontend static build (/) 
#                                  -> backend container (/api/*, :8000)
#
# The backend's persistent state (uploaded audio, transcripts, Chroma vector
# index) lives on a named volume backed by the instance's own block volume
# -- this is the thing Render's free tier couldn't give you. Lecture/chat/
# quiz *metadata* and user accounts live in Supabase (Postgres + Auth), not
# on this box at all, so the box itself is disposable/replaceable as long as
# lecture_data volume and your .env are backed up.
#
# Usage:
#   cp backend/.env.example backend/.env   # fill in Supabase + API keys
#   docker compose up -d --build
#
# Put nginx/certbot in front separately (see backend/README.md "Deploying to
# Oracle Cloud"), or swap the ports mapping below to expose 8000 directly
# while testing.

services:
  backend:
    # Published by CI (.github/workflows/ci.yml) on every push to main.
    # The server pulls this finished image instead of building it -- see
    # the comment in that workflow for why building on the instance took
    # production down. IMAGE_TAG lets a deploy pin an older build for
    # rollback: IMAGE_TAG=<commit-sha> docker compose up -d
    image: ghcr.io/harris-05/ai-study-assistant-backend:${IMAGE_TAG:-latest}
    # Kept so local development still works with `docker compose build`
    # or `docker compose up --build`. The server never uses it.
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - MEDIA_ROOT=/data/media
    volumes:
      - lecture_data:/data/media
    ports:
      # Bound to localhost only: Nginx (on the host) proxies to this, and
      # nothing outside the machine should reach Django directly. Docker
      # writes its own iptables rules, so relying on the cloud firewall
      # alone is not sufficient here.
      - "127.0.0.1:8000:8000"

volumes:
  lecture_data: